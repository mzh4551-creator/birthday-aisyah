<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff9ec4,#ffd6e7);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.card{
    background:white;
    width:90%;
    max-width:400px;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    color:#ff4f81;
    margin-bottom:15px;
}

p{
    color:#555;
    margin-bottom:20px;
}

button{
    background:#ff4f81;
    color:white;
    border:none;
    padding:15px 25px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
}

#hadiah{
    display:none;
    margin-top:25px;
    animation:fade .7s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
</style>

</head>
<body>

<div class="card">

<h1>🎂 Happy Birthday 🎂</h1>

<p>Ada hadiah spesial buat kamu 🤍</p>

<button id="btn">🎁 Buka Hadiah</button>

<div id="hadiah">

<h2>💐 Happy Birthday Aisyah 💐</h2>

<p>
Semoga hari-harimu selalu dipenuhi kebahagiaan,
kesehatan, dan semua impianmu tercapai. 🤍
</p>

</div>

</div>

<script>

const tombol=document.getElementById("btn");

const hadiah=document.getElementById("hadiah");

tombol.addEventListener("click",function(){

hadiah.style.display="block";

tombol.style.display="none";

});

</script>

</body>
</html>
